<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>חזרה לקראת מבחן בביולוגיה – י״א | הוכן על ידי המורה איילת מימרן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6ff;--card:#ffffff;--ink:#1d2340;--muted:#5b6385;--line:#dfe4f5;
  --c1:#1f9d55;--c2:#e07a0b;--c3:#2b7fe0;--c4:#8a4fe6;--c5:#d63a79;--c6:#0c9a9a;--c7:#b88700;
  --onc:#ffffff;--ok:#1f8f4e;--bad:#d1384a;--mid:#c47f00;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101428;--card:#1b2040;--ink:#eef0ff;--muted:#a9b0d4;--line:#313963;
    --c1:#4bd68b;--c2:#ffa24a;--c3:#5ca3ff;--c4:#b48cff;--c5:#ff6e9f;--c6:#42d6d2;--c7:#ffd04a;
    --onc:#101428;--ok:#55d98b;--bad:#ff7487;--mid:#ffc25a;
  }
}
:root[data-theme="dark"]{
  --bg:#101428;--card:#1b2040;--ink:#eef0ff;--muted:#a9b0d4;--line:#313963;
  --c1:#4bd68b;--c2:#ffa24a;--c3:#5ca3ff;--c4:#b48cff;--c5:#ff6e9f;--c6:#42d6d2;--c7:#ffd04a;
  --onc:#101428;--ok:#55d98b;--bad:#ff7487;--mid:#ffc25a;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Heebo',system-ui,Arial,sans-serif;font-size:17px;line-height:1.6}
h1,h2,h3{font-family:'Secular One','Heebo',Arial,sans-serif;font-weight:400;margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--c3);outline-offset:2px}

.banner{background:linear-gradient(115deg,#2b6fe0 0%,#7a45da 50%,#d63f86 100%);color:#fff;padding:26px 18px 22px;text-align:center;position:relative;overflow:hidden}
.banner:before,.banner:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.13)}
.banner:before{width:190px;height:190px;top:-70px;right:-50px}
.banner:after{width:130px;height:130px;bottom:-60px;left:6%}
.banner h1{font-size:clamp(26px,5vw,40px);line-height:1.2;position:relative}
.banner p{margin:8px 0 0;font-size:17px;position:relative;opacity:.96}
.by{display:inline-block;margin-top:12px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:5px 18px;font-weight:700;position:relative}

.bar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.bar-in{max-width:980px;margin:auto;display:flex;gap:10px;align-items:center}
.steps{display:flex;gap:6px;overflow-x:auto;flex:1;padding:2px;scrollbar-width:thin}
.step{flex:0 0 auto;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.step.on{background:var(--c);border-color:var(--c);color:var(--onc)}
.step.done:after{content:"✓";font-weight:800;color:var(--ok)}
.step.on.done:after{color:var(--onc)}
.score{flex:0 0 auto;background:color-mix(in srgb,var(--c7) 22%,var(--card));border:2px solid var(--c7);border-radius:14px;padding:3px 12px;font-weight:800;text-align:center;line-height:1.2;font-size:14px}
.score b{font-size:19px;display:block}

main{max-width:980px;margin:18px auto 40px;padding:0 14px}
.hero{display:flex;gap:16px;align-items:center;background:var(--c);color:var(--onc);border-radius:22px;padding:18px 22px;margin-bottom:16px}
.hero .em{font-size:48px;background:rgba(255,255,255,.25);width:76px;height:76px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.hero h2{font-size:clamp(24px,4.5vw,34px);line-height:1.2}
.hero p{margin:4px 0 0;opacity:.95}
.card{background:var(--card);border:1px solid var(--line);border-right:7px solid var(--c);border-radius:16px;padding:16px 18px;margin:0 0 16px}
.card h3{font-size:22px;margin-bottom:8px;color:var(--c)}
.note{background:color-mix(in srgb,var(--c) 10%,var(--card))}
.tip{background:color-mix(in srgb,var(--c7) 16%,var(--card));border-right-color:var(--c7)}
.tip h3{color:var(--ink)}
ul{margin:6px 0;padding-inline-start:22px}
li{margin:3px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{background:color-mix(in srgb,var(--c) 16%,var(--card));border:1px solid color-mix(in srgb,var(--c) 45%,var(--card));border-radius:999px;padding:2px 12px;font-size:15px;font-weight:500}
.btn{background:var(--c);color:var(--onc);border:0;border-radius:12px;padding:9px 20px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.seg button{border:2px solid color-mix(in srgb,var(--c) 50%,var(--line));background:var(--card);border-radius:12px;padding:6px 14px;font-weight:700}
.seg button.on{background:var(--c);color:var(--onc);border-color:var(--c)}
.svgbox{background:color-mix(in srgb,var(--c) 6%,var(--card));border:1px solid var(--line);border-radius:14px;padding:6px;text-align:center}
.svgbox svg{width:100%;height:auto;max-width:560px;direction:ltr}
.hs{cursor:pointer}.hs:hover{opacity:.85}.hs.sel{filter:drop-shadow(0 0 6px #ffcf00) drop-shadow(0 0 2px #ffcf00)}
.info{margin-top:10px;background:color-mix(in srgb,var(--c) 11%,var(--card));border-radius:12px;padding:10px 14px;min-height:76px}
.info h4{margin:0 0 4px;font-size:19px;color:var(--c)}
.status{margin-top:10px;border-radius:12px;padding:10px 14px;background:color-mix(in srgb,var(--c) 11%,var(--card))}
.status b{color:var(--c)}
.slider{display:block;margin:10px 0 4px;font-weight:700}
.slider input{width:100%;accent-color:var(--c)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.ctl{background:color-mix(in srgb,var(--c) 7%,var(--card));border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.ctl select{font:inherit;padding:4px 6px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.gauge{height:22px;background:var(--line);border-radius:999px;overflow:hidden;margin:4px 0}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--c7));border-radius:999px;transition:width .25s}
table.tbl{border-collapse:collapse;width:100%;font-size:15.5px;margin:8px 0}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 9px;text-align:center}
.tbl th{background:color-mix(in srgb,var(--c) 18%,var(--card))}
.tbl td:first-child{text-align:start;font-weight:700}
.tw{overflow-x:auto}
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.flip{border:2px solid color-mix(in srgb,var(--c) 55%,var(--line));background:color-mix(in srgb,var(--c) 8%,var(--card));border-radius:14px;padding:12px;text-align:start;min-height:112px}
.flip .big{font-size:30px;display:block}
.flip b{font-size:17px}
.flip.open{background:var(--c);color:var(--onc);border-color:var(--c)}
.hint{font-size:14px;color:var(--muted)}

.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 14px;border-right:7px solid var(--c)}
.qhead{display:flex;justify-content:flex-end}
.pts{font-size:13px;font-weight:700;background:color-mix(in srgb,var(--c) 18%,var(--card));border-radius:999px;padding:0 10px}
.qtext{font-weight:700;margin-bottom:8px}
.opt{display:block;width:100%;text-align:start;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin:6px 0;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--c)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.fb{margin-top:10px;border-radius:12px;padding:9px 13px;font-size:16px}
.fb.ok{background:color-mix(in srgb,var(--ok) 16%,var(--card));border:1px solid var(--ok)}
.fb.bad{background:color-mix(in srgb,var(--bad) 14%,var(--card));border:1px solid var(--bad)}
.fb.mid{background:color-mix(in srgb,var(--mid) 16%,var(--card));border:1px solid var(--mid)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;margin:7px 0;padding:6px 8px;border-radius:10px;border:2px solid transparent}
.mrow select{font:inherit;padding:5px 6px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.mrow.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.mrow.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.mrow small{grid-column:1/-1;color:var(--bad);font-weight:700}
@media (max-width:560px){.mrow{grid-template-columns:1fr}}
textarea{width:100%;min-height:90px;font:inherit;padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.model{margin-top:8px;background:color-mix(in srgb,var(--ok) 12%,var(--card));border:1px dashed var(--ok);border-radius:10px;padding:8px 12px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.bag{border:3px solid var(--c);border-radius:20px;padding:14px;margin:0 0 18px;background:color-mix(in srgb,var(--c) 5%,var(--bg))}
.bag>h3{background:var(--c);color:var(--onc);display:inline-block;padding:3px 16px;border-radius:999px;font-size:19px;margin-bottom:10px}
.stem{background:var(--card);border-radius:12px;padding:10px 14px;margin-bottom:12px;border:1px solid var(--line)}
.navb{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.sumrow{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;margin:8px 0}
.sumrow .gauge{height:18px}
@media (max-width:560px){.sumrow{grid-template-columns:100px 1fr 64px;font-size:15px}.hero{flex-direction:column;text-align:center}}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;margin-top:10px}
.gl div{background:color-mix(in srgb,var(--c) 8%,var(--card));border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:15.5px}
.gl b{color:var(--c)}
.search{width:100%;font:inherit;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
footer{text-align:center;color:var(--muted);padding:6px 12px 26px;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="banner">
  <h1>🧬 חזרה לקראת מבחן בביולוגיה 🔬</h1>
  <p>מבנה התא • מעבר חומרים • אנזימים • ההרכב הכימי של התא</p>
  <span class="by">הפעילות הוכנה על ידי המורה איילת מימרן</span>
</header>
<div class="bar"><div class="bar-in">
  <nav class="steps" id="steps" aria-label="שלבי הפעילות"></nav>
  <div class="score" title="הניקוד נצבר בניסיון הראשון בכל שאלה">ניקוד<b id="sc">0</b></div>
</div></div>
<main id="main"></main>
<footer>הפעילות הוכנה על ידי המורה איילת מימרן • כיתה י״א • ביולוגיה</footer>

<script>
/* ---------- helpers ---------- */
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lcg=seed=>{let s=seed;return()=>(s=(s*16807)%2147483647)/2147483647;};
const state={stage:0,scores:{}};

/* ---------- chart helper ---------- */
function chart(o){
  const W=440,H=270,L=54,R=14,T=16,B=50;
  const sx=x=>L+(x-o.xmin)/(o.xmax-o.xmin)*(W-L-R), sy=y=>H-B-(y-o.ymin)/(o.ymax-o.ymin)*(H-B-T);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.label||'גרף'}" style="direction:ltr">`;
  (o.yt||[]).forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)"/><text x="${L-6}" y="${sy(v)+4}" text-anchor="end" style="fill:var(--muted);font-size:11px">${v}</text>`;});
  (o.xt||[]).forEach(v=>{s+=`<line y1="${T}" y2="${H-B}" x1="${sx(v)}" x2="${sx(v)}" stroke="var(--line)"/><text x="${sx(v)}" y="${H-B+15}" text-anchor="middle" style="fill:var(--muted);font-size:11px">${v}</text>`;});
  s+=`<line x1="${L}" x2="${L}" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-width="1.6"/><line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--muted)" stroke-width="1.6"/>`;
  s+=`<text x="${(L+W-R)/2}" y="${H-10}" text-anchor="middle" style="fill:var(--ink);font-size:12.5px;font-weight:700">${o.xl||''}</text>`;
  s+=`<text transform="translate(14 ${(T+H-B)/2}) rotate(-90)" text-anchor="middle" style="fill:var(--ink);font-size:12.5px;font-weight:700">${o.yl||''}</text>`;
  (o.series||[]).forEach(se=>{
    const d=se.p.map((p,i)=>(i?'L':'M')+sx(p[0]).toFixed(1)+' '+sy(p[1]).toFixed(1)).join(' ');
    s+=`<path d="${d}" fill="none" stroke="${se.c}" stroke-width="3" stroke-linejoin="round" ${se.dash?'stroke-dasharray="6 4"':''}/>`;
    if(se.mark)se.p.forEach(p=>{s+=`<circle cx="${sx(p[0])}" cy="${sy(p[1])}" r="4" fill="${se.c}"/>`;});
  });
  if(o.series&&o.series.length>1&&o.legend!==false){o.series.forEach((se,i)=>{s+=`<rect x="${L+12}" y="${T+4+i*18}" width="16" height="4" fill="${se.c}"/><text x="${L+34}" y="${T+10+i*18}" style="fill:var(--ink);font-size:12px">${se.n}</text>`;});}
  if(o.dot)s+=`<circle cx="${sx(o.dot.x)}" cy="${sy(o.dot.y)}" r="7" fill="#fff" stroke="#e0262f" stroke-width="3.5"/>`;
  return s+'</svg>';
}

/* ---------- question engine ---------- */
let QC=0;
const Q=o=>{o.id='q'+(++QC);return {k:'q',q:o};};
const H=(html,cls)=>({k:'h',html,cls:cls||'note'});
const W=fn=>({k:'w',fn});
const BAG=(title,stem,qs)=>({k:'b',title,stem,qs});

function totals(stage){
  let got=0,max=0,n=0,ans=0;
  STAGES.forEach((S,i)=>{if(stage!=null&&i!==stage)return;allQs(S).forEach(q=>{max+=q.pts||1;n++;const r=state.scores[q.id];if(r){got+=r.got;ans++;}});});
  return {got,max,n,ans};
}
function allQs(S){const r=[];S.blocks.forEach(b=>{if(b.k==='q')r.push(b.q);if(b.k==='b')b.qs.forEach(x=>r.push(x.q));});return r;}
function record(q,got){if(state.scores[q.id])return;state.scores[q.id]={got,max:q.pts||1};refreshBar();}
function refreshBar(){
  const t=totals();document.getElementById('sc').textContent=(Math.round(t.got*10)/10)+' / '+t.max;
  document.querySelectorAll('.step').forEach((b,i)=>{const s=STAGES[i];const qs=allQs(s);b.classList.toggle('done',qs.length>0&&qs.every(q=>state.scores[q.id]));});
}

function mkQ(q){
  const pts=q.pts||1,w=el('div','q'),fb=el('div','fb');fb.hidden=true;
  w.innerHTML=`<div class="qhead"><span class="pts">${pts} ${pts===1?'נקודה':'נקודות'}</span></div><div class="qtext">${q.q}</div>`;
  const body=el('div','qbody');w.append(body,fb);
  const say=(k,t)=>{fb.hidden=false;fb.className='fb '+k;fb.innerHTML=t;};
  const retry=()=>{const b=el('button','btn ghost','ניסיון נוסף (ללא ניקוד)');b.style.marginTop='8px';b.onclick=()=>{const n=mkQ(q);w.replaceWith(n);};fb.append(document.createElement('br'),b);};

  if(q.t==='mcq'){
    let done=false;
    shuffle(q.o.map((t,i)=>({t,ok:i===0}))).forEach(o=>{
      const b=el('button','opt',o.t);
      b.onclick=()=>{
        if(done)return;done=true;
        body.querySelectorAll('.opt').forEach(x=>x.disabled=true);
        b.classList.add(o.ok?'ok':'bad');
        if(!o.ok)body.querySelectorAll('.opt').forEach(x=>{if(x._ok)x.classList.add('ok');});
        record(q,o.ok?pts:0);
        say(o.ok?'ok':'bad',(o.ok?'✔ נכון! ':'✘ לא מדויק. ')+(q.e||''));retry();
      };
      b._ok=o.ok;body.append(b);
    });
  }
  else if(q.t==='match'||q.t==='cat'){
    const rows=q.rows,choices=shuffle(q.ch||[...new Set(rows.map(r=>r[1]))]);
    const sels=[],rowEls=[];
    rows.forEach(r=>{
      const d=el('div','mrow');d.append(el('span','',r[0]));
      const s=document.createElement('select');s.setAttribute('aria-label',r[0]);
      s.append(new Option('בחרו…',''));choices.forEach(c=>s.append(new Option(c,c)));
      d.append(s);body.append(d);sels.push(s);rowEls.push(d);
    });
    const b=el('button','btn','בדיקה');b.style.marginTop='6px';body.append(b);
    b.onclick=()=>{
      let c=0;
      rows.forEach((r,i)=>{
        const ok=sels[i].value===r[1];if(ok)c++;
        rowEls[i].className='mrow '+(ok?'ok':'bad');rowEls[i].querySelectorAll('small').forEach(x=>x.remove());
        if(!ok)rowEls[i].append(el('small','','התשובה הנכונה: '+r[1]));
      });
      record(q,Math.round(pts*c/rows.length*100)/100);
      say(c===rows.length?'ok':(c>0?'mid':'bad'),`${c} מתוך ${rows.length} נכון. ${q.e||''}`);retry();
    };
  }
  else if(q.t==='grid'){
    const tb=el('div','tw');let h=`<table class="tbl"><tr><th></th>${q.cols.map(c=>`<th>${c}</th>`).join('')}</tr>`;
    q.rows.forEach((r,i)=>{h+=`<tr><td>${r[0]}</td>${q.cols.map((c,j)=>`<td><input type="checkbox" data-i="${i}" data-j="${j}" aria-label="${r[0]} – ${c}" style="width:20px;height:20px;accent-color:var(--c)"></td>`).join('')}</tr>`;});
    tb.innerHTML=h+'</table>';body.append(tb);
    const b=el('button','btn','בדיקה');body.append(b);
    b.onclick=()=>{
      let c=0,n=0;
      tb.querySelectorAll('input').forEach(x=>{
        const ok=x.checked===!!q.rows[+x.dataset.i][1][+x.dataset.j];n++;if(ok)c++;
        x.parentElement.style.background=ok?'color-mix(in srgb,var(--ok) 22%,transparent)':'color-mix(in srgb,var(--bad) 25%,transparent)';
      });
      record(q,Math.round(pts*c/n*100)/100);
      say(c===n?'ok':(c>n*0.7?'mid':'bad'),`${c} מתוך ${n} משבצות נכונות (משבצת אדומה = טעות). ${q.e||''}`);retry();
    };
  }
  else if(q.t==='open'){
    const ta=document.createElement('textarea');ta.placeholder='כתבו כאן את התשובה שלכם…';body.append(ta);
    const r=el('div','row');const b=el('button','btn','הצגת תשובה לדוגמה');r.append(b);body.append(r);
    b.onclick=()=>{
      b.disabled=true;const m=el('div','model','<b>תשובה לדוגמה:</b><br>'+q.m);body.append(m);
      const g=el('div','row');g.append(el('span','','בדקו את עצמכם בכנות:'));
      [['✔ עניתי נכון',pts],['≈ עניתי חלקית',pts/2],['✘ לא הצלחתי',0]].forEach(([t,v])=>{
        const x=el('button','btn ghost',t);x.onclick=()=>{record(q,v);g.remove();say(v===pts?'ok':v?'mid':'bad','הניקוד נרשם: '+v+' מתוך '+pts+'. '+(q.e||''));};g.append(x);
      });
      body.append(g);
    };
  }

  return w;
}

/* ---- osmosis simulator ---- */
function osmosisSim(){
  const w=el('div');let type='animal',ext=0.9;
  w.innerHTML=`<h3>💧 הדמיה: אוסמוזה בתא</h3><p>הריכוז הפנימי של המומסים בתא הוא <b>0.9%</b> (כמו בתמיסת מלח פיזיולוגית). שנו את ריכוז המלח מחוץ לתא וראו מה קורה.</p>
  <div class="seg" id="ot"><button data-t="animal" class="on">🩸 תא דם אדום (בעל חיים)</button><button data-t="plant">🧅 תא צמח</button></div>
  <div class="svgbox"><svg viewBox="0 0 420 250" id="ov" role="img" aria-label="הדמיית אוסמוזה"></svg></div>
  <label class="slider">ריכוז המלח מחוץ לתא: <b id="ovl">0.9%</b><input type="range" min="0" max="2" step="0.1" value="0.9" id="orng"></label>
  <div class="seg" id="op"><button data-v="0">מים מזוקקים (0%)</button><button data-v="0.9">0.9%</button><button data-v="1.8">1.8%</button></div>
  <div class="status" id="ost"></div>`;
  const svg=w.querySelector('#ov'),rng=w.querySelector('#orng'),st=w.querySelector('#ost');
  function draw(){
    w.querySelector('#ovl').textContent=ext.toFixed(1)+'%';
    const cx=210,cy=125,r=lcg(7),outside=[],inside=[];
    let s=`<defs><marker id="ma" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#1e88e5"/></marker></defs>`;
    s+=`<rect width="420" height="250" rx="14" fill="#ff9800" fill-opacity="${(ext/2*0.3).toFixed(2)}"/>`;
    for(let i=0;i<260;i++){const x=12+r()*396,y=12+r()*226;if(x<100||x>320||y<30||y>222)outside.push([x,y]);}
    const N=Math.min(outside.length,Math.round(ext/0.9*12));
    for(let i=0;i<12;i++)inside.push([r()*2-1,r()*2-1]);
    let state1='';
    if(type==='animal'){
      const sc=clamp(1+(0.9-ext)*0.38,0.62,1.42),rad=62*sc;
      if(ext>1.05){
        const amp=Math.min(0.16,(ext-0.9)*0.2);let d='';
        for(let i=0;i<=36;i++){const a=i/36*Math.PI*2,rr=rad*(1+(i%2?amp:-amp));d+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)).toFixed(1);}
        s+=`<path d="${d}Z" fill="#e8505b" stroke="#8d1d27" stroke-width="3" stroke-linejoin="round"/>`;
      }else if(sc>=1.38){s+=`<circle cx="${cx}" cy="${cy}" r="${rad}" fill="#e8505b" fill-opacity=".5" stroke="#8d1d27" stroke-width="3" stroke-dasharray="7 6"/><text x="${cx}" y="${cy+8}" text-anchor="middle" font-size="26">💥</text>`;}
      else s+=`<circle cx="${cx}" cy="${cy}" r="${rad}" fill="#e8505b" stroke="#8d1d27" stroke-width="3"/>`;
      inside.forEach(p=>{s+=`<circle cx="${cx+p[0]*rad*0.62}" cy="${cy+p[1]*rad*0.62}" r="3.2" fill="#ffb000" stroke="#fff" stroke-width=".8"/>`;});
      state1=ext<0.85?(sc>=1.38?'התא התנפח עד שהקרום נקרע (המוליזה)':'התא מתנפח'):ext>0.95?'התא מתכווץ ונעשה מקומט':'התא שומר על נפחו';
    }else{
      const p=ext<=0.9?1:Math.max(0.55,1-(ext-0.9)*0.4),pw=168*p,ph=148*p;
      s+=`<rect x="126" y="51" width="168" height="148" fill="#ff9800" fill-opacity="${p<1?0.3:0}"/>`;
      s+=`<rect x="${cx-pw/2}" y="${cy-ph/2}" width="${pw}" height="${ph}" rx="10" fill="#d9f3c7" stroke="#d6336c" stroke-width="3"/>`;
      s+=`<ellipse cx="${cx+8}" cy="${cy}" rx="${52*p}" ry="${44*p}" fill="#bfe3ff" stroke="#3f86d0" stroke-width="2"/><circle cx="${cx-pw/2+22*p}" cy="${cy-ph/2+22*p}" r="${11*p}" fill="#b9a8ff" stroke="#5b43c9" stroke-width="2"/>`;
      s+=`<rect x="120" y="45" width="180" height="160" rx="12" fill="none" stroke="#2e8b57" stroke-width="12"/>`;
      inside.forEach(q=>{s+=`<circle cx="${cx+q[0]*pw*0.4}" cy="${cy+q[1]*ph*0.4}" r="3.2" fill="#ffb000" stroke="#fff" stroke-width=".8"/>`;});
      state1=ext<0.85?'התא תפוח (טורגור) – הדופן מונעת התפוצצות':ext>0.95?'פלסמוליזה: הקרום והציטופלסמה נפרדים מהדופן':'התא במצב רגיל';
    }
    outside.slice(0,N).forEach(p=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.6" fill="#ffb000" stroke="#fff" stroke-width=".8"/>`;});
    const n=Math.min(4,Math.round(Math.abs(ext-0.9)/0.25)),inw=ext<0.9;
    const A=[[45,125,85,125],[375,125,335,125],[170,8,170,40],[250,242,250,212]];
    for(let i=0;i<n;i++){const a=A[i];const v=inw?a:[a[2],a[3],a[0],a[1]];s+=`<line x1="${v[0]}" y1="${v[1]}" x2="${v[2]}" y2="${v[3]}" stroke="#1e88e5" stroke-width="4" marker-end="url(#ma)"/>`;}
    if(n>0)s+=`<text x="${inw?18:395}" y="112" text-anchor="middle" style="fill:#1565c0;font-size:12px;font-weight:700">מים</text>`;
    s+=`<text x="10" y="242" style="fill:var(--ink);font-size:11px">● חלקיקי מלח</text>`;
    svg.innerHTML=s;
    const rel=ext<0.85?'היפוטונית':ext>0.95?'היפרטונית':'איזוטונית';
    const mv=ext<0.85?'מים נכנסים לתא (מריכוז מומסים נמוך – מבחוץ – אל ריכוז מומסים גבוה – בפנים)':ext>0.95?'מים יוצאים מהתא (מהפנים, שבו ריכוז המומסים נמוך יותר, אל החוץ)':'כניסת מים ויציאת מים שווות – אין שינוי נפח';
    st.innerHTML=`התמיסה שמחוץ לתא (${ext.toFixed(1)}%) היא <b>${rel}</b> ביחס לתא.<br>תנועת המים נטו: <b>${mv}</b>.<br>תוצאה: <b>${state1}</b>.`;
  }
  rng.oninput=()=>{ext=+rng.value;draw();};
  w.querySelectorAll('#op button').forEach(b=>b.onclick=()=>{ext=+b.dataset.v;rng.value=ext;draw();});
  w.querySelectorAll('#ot button').forEach(b=>b.onclick=()=>{type=b.dataset.t;w.querySelectorAll('#ot button').forEach(x=>x.classList.toggle('on',x===b));draw();});
  draw();return w;
}

/* ---- enzyme lab ---- */
function enzymeLab(){
  const w=el('div');
  const S={T:37,pH:7,S:50,E:5,inh:'none',enz:'amy',plot:'T'};
  w.innerHTML=`<h3>⚡ מעבדה וירטואלית: מה משפיע על פעולת אנזים?</h3><p>שנו את התנאים וצפו בקצב התגובה, במבנה האנזים ובגרף.</p>
  <div class="grid2">
   <div class="ctl"><label>האנזים<select id="ez"><option value="amy">עמילאז ברוק (pH אופטימלי ≈ 7)</option><option value="pep">פפסין בקיבה (pH אופטימלי ≈ 2)</option></select></label></div>
   <div class="ctl"><label>מעכב<select id="ei"><option value="none">ללא מעכב</option><option value="comp">מעכב תחרותי</option><option value="non">מעכב לא תחרותי</option></select></label></div>
   <div class="ctl"><label>טמפרטורה: <b id="vT"></b>°C<input id="rT" type="range" min="0" max="80" step="1" style="width:100%;accent-color:var(--c)"></label></div>
   <div class="ctl"><label>pH: <b id="vP"></b><input id="rP" type="range" min="1" max="13" step="0.5" style="width:100%;accent-color:var(--c)"></label></div>
   <div class="ctl"><label>ריכוז מצע (סובסטרט): <b id="vS"></b><input id="rS" type="range" min="0" max="100" step="1" style="width:100%;accent-color:var(--c)"></label></div>
   <div class="ctl"><label>ריכוז אנזים: <b id="vE"></b><input id="rE" type="range" min="1" max="10" step="1" style="width:100%;accent-color:var(--c)"></label></div>
  </div>
  <div class="svgbox" style="margin-top:10px"><svg viewBox="0 0 300 150" id="esv" style="max-width:420px" role="img" aria-label="אנזים ומצע"></svg></div>
  <div class="status"><b>קצב התגובה:</b> <span id="rv"></span><div class="gauge"><i id="rg"></i></div><div id="rs"></div></div>
  <h4 style="margin:14px 0 4px">הגרף: קצב התגובה כפונקציה של…</h4>
  <div class="seg" id="ep"><button data-p="T" class="on">טמפרטורה</button><button data-p="pH">pH</button><button data-p="S">ריכוז מצע</button><button data-p="E">ריכוז אנזים</button></div>
  <div class="svgbox" id="ech"></div>`;
  const $=s=>w.querySelector(s);
  const opt=()=>S.enz==='amy'?7:2;
  const fT=T=>T<=40?Math.pow(T/40,1.8):Math.max(0,1-Math.pow((T-40)/20,1.4));
  const fP=p=>Math.exp(-Math.pow(p-opt(),2)/(2*1.5*1.5));
  const rate=(o)=>{
    const Km=20*(S.inh==='comp'?4:1),f=S.inh==='non'?0.5:1;
    return 100*fT(o.T)*fP(o.pH)*(o.E/10)*(o.S/(Km+o.S))*1.2*f;
  };
  const cur=()=>({T:S.T,pH:S.pH,S:S.S,E:S.E});
  function enzSVG(r){
    const denat=S.T>55||fP(S.pH)<0.2,N='M60 130 C20 120 15 50 70 35 C110 25 120 55 150 55 C180 55 190 25 230 35 C285 50 280 120 240 130 C200 140 100 140 60 130Z';
    const D='M60 130 C10 100 40 40 80 50 C110 55 135 30 150 30 C170 30 190 60 225 45 C290 40 270 120 240 130 C200 140 100 140 60 130Z';
    const M='M60 130 C20 120 15 50 70 35 C110 25 130 50 150 55 C170 50 190 25 230 35 C285 50 280 120 240 130 C200 140 100 140 60 130Z';
    let s='';
    if(denat)s=`<path d="${D}" fill="#8a4fe6" stroke="#4a2a9a" stroke-width="3" stroke-dasharray="6 3"/><path d="M118 8 L182 8 L150 50Z" fill="#f2c200" stroke="#9a7a00" stroke-width="2" transform="translate(60 -2) rotate(25 150 30)"/><text x="150" y="100" text-anchor="middle" style="fill:#fff;font-size:15px;font-weight:700">דנטורציה ✗</text>`;
    else if(S.inh==='comp')s=`<path d="${N}" fill="#8a4fe6" stroke="#4a2a9a" stroke-width="3"/><path d="M120 12 L180 12 L150 54Z" fill="#ef6c00" stroke="#8a3d00" stroke-width="2"/><path d="M236 20 L276 20 L256 46Z" fill="#f2c200" stroke="#9a7a00" stroke-width="2"/><text x="150" y="105" text-anchor="middle" style="fill:#fff;font-size:13px;font-weight:700">המעכב תפס את האתר הפעיל</text>`;
    else if(S.inh==='non')s=`<path d="${M}" fill="#8a4fe6" stroke="#4a2a9a" stroke-width="3"/><circle cx="268" cy="100" r="16" fill="#ef6c00" stroke="#8a3d00" stroke-width="2"/><path d="M236 8 L276 8 L256 34Z" fill="#f2c200" stroke="#9a7a00" stroke-width="2"/><text x="150" y="105" text-anchor="middle" style="fill:#fff;font-size:13px;font-weight:700">המעכב שינה את מבנה האנזים</text>`;
    else s=`<path d="${N}" fill="#8a4fe6" stroke="#4a2a9a" stroke-width="3"/><path d="M118 14 L182 14 L150 54Z" fill="#f2c200" stroke="#9a7a00" stroke-width="2"/><text x="150" y="105" text-anchor="middle" style="fill:#fff;font-size:13px;font-weight:700">אתר פעיל + מצע = מתאימים</text>`;
    return s+`<text x="12" y="146" style="fill:var(--muted);font-size:11px">מצע = צהוב • אנזים = סגול • מעכב = כתום</text>`;
  }
  function chartFor(){
    const k=S.plot,cfg={T:[0,80,'טמפרטורה (°C)',[0,20,40,60,80]],pH:[1,13,'pH',[1,3,5,7,9,11,13]],S:[0,100,'ריכוז מצע',[0,25,50,75,100]],E:[1,10,'ריכוז אנזים',[1,4,7,10]]}[k];
    const pts=[];const n=80;for(let i=0;i<=n;i++){const x=cfg[0]+(cfg[1]-cfg[0])*i/n;const o=cur();o[k]=x;pts.push([x,rate(o)]);}
    return chart({xmin:cfg[0],xmax:cfg[1],ymin:0,ymax:100,xt:cfg[3],yt:[0,25,50,75,100],xl:cfg[2],yl:'קצב התגובה (%)',series:[{n:'',c:'#8a4fe6',p:pts}],dot:{x:S[k],y:rate(cur())},label:'גרף קצב התגובה'});
  }
  function upd(){
    $('#vT').textContent=S.T;$('#vP').textContent=S.pH;$('#vS').textContent=S.S;$('#vE').textContent=S.E;
    const r=rate(cur());$('#rv').textContent=Math.round(r)+'% מהקצב המרבי האפשרי';$('#rg').style.width=r+'%';
    $('#esv').innerHTML=enzSVG(r);
    const denat=S.T>55||fP(S.pH)<0.2;let m='';
    if(denat)m='<b>הבחינו:</b> בטמפרטורה גבוהה מאוד או ב-pH קיצוני המבנה המרחבי של האנזים (חלבון) משתנה – האתר הפעיל כבר לא מתאים למצע. זו <b>דנטורציה</b>, ובדרך כלל היא בלתי הפיכה.';
    else if(S.T<10)m='בטמפרטורה נמוכה חלקיקים נעים לאט, פחות מפגשים בין אנזים למצע. האנזים <b>לא נהרס</b> ויחזור לפעול בחימום.';
    else if(S.inh==='comp')m='מעכב תחרותי דומה למצע ונקשר לאתר הפעיל. אפשר להתגבר על ההשפעה בהגדלת ריכוז המצע.';
    else if(S.inh==='non')m='מעכב לא תחרותי נקשר מחוץ לאתר הפעיל וגורם לשינוי במבנה האנזים. הגדלת המצע לא תבטל את ההשפעה.';
    else if(S.S>=80&&S.E<10)m='ריכוז המצע גבוה: כמעט כל האנזימים תפוסים (<b>רוויה</b>). הוספת מצע לא תגדיל את הקצב – הגבלת הקצב היא כמות האנזים.';
    else m='התנאים קרובים לאופטימליים. נסו לשנות גורם אחד בכל פעם (כמו בניסוי אמיתי!).';
    $('#rs').innerHTML=m;$('#ech').innerHTML=chartFor();
  }
  [['rT','T'],['rP','pH'],['rS','S'],['rE','E']].forEach(([id,k])=>{const i=$('#'+id);i.value=S[k];i.oninput=()=>{S[k]=+i.value;upd();};});

/* ---- summary ---- */
function summary(){
  const w=el('div');
  const t=totals();
  const names=['מאפייני חיים','מבנה התא','מעבר חומרים','אנזימים','הרכב כימי','בגרות'];
  let h=`<h3>🏆 סיכום הביצועים שלכם</h3>`;
  names.forEach((n,i)=>{const s=totals(i);const p=s.max?Math.round(s.got/s.max*100):0;h+=`<div class="sumrow" style="--c:var(--c${i+1})"><b>${n}</b><div class="gauge"><i style="width:${p}%"></i></div><span>${p}% (${s.ans}/${s.n})</span></div>`;});
  const p=t.max?t.got/t.max*100:0;
  h+=`<div class="status" style="margin-top:14px"><b>סך הכול: ${Math.round(t.got*10)/10} מתוך ${t.max} נקודות (${Math.round(p)}%)</b><br>ענית על ${t.ans} מתוך ${t.n} שאלות.<br>`;
  h+=t.ans<t.n?'חלק מהשאלות עדיין לא נענו – חזרו לשלבים הקודמים והשלימו.':p>=85?'מצוין! אתם מוכנים היטב. עברו על המילון וחזרו רק על מה שנשאר לא ברור.':p>=65?'כל הכבוד, אתם בכיוון הנכון. חזרו על השלבים עם האחוזים הנמוכים ביותר.':'יש עוד מה לחזק – חזרו להסברים וההדמיות בשלבים החלשים, ונסו שוב את התרגילים.';
  h+='</div>';
  const weak=names.map((n,i)=>[n,totals(i)]).filter(([n,s])=>s.max&&s.ans===s.n&&s.got/s.max<0.7).map(x=>x[0]);
  if(weak.length)h+=`<p><b>כדאי לחזור על:</b> ${weak.join(', ')}</p>`;
  w.innerHTML=h;return w;
}

  Q({t:'mcq',pts:1,q:'ג. הוסיפו לתא רעל החוסם ייצור ATP. איזה מעבר ייפגע בוודאות?',o:['העברה פעילה','דיפוזיה פשוטה','אוסמוזה','דיפוזיה מוקלת'],e:'העברה פעילה דורשת אנרגיה (ATP); דיפוזיה (פשוטה או מוקלת) ואוסמוזה אינן דורשות.'})]),

];

/* ---------- app ---------- */
const main=document.getElementById('main'),stepsEl=document.getElementById('steps');
STAGES.forEach((S,i)=>{
  const b=el('button','step',`<span>${S.icon}</span><span>${S.short}</span>`);
  b.style.setProperty('--c',`var(--c${i+1})`);b.onclick=()=>go(i);stepsEl.append(b);
});
function go(i){
  state.stage=i;const S=STAGES[i];main.innerHTML='';main.style.setProperty('--c',`var(--c${i+1})`);
  document.querySelectorAll('.step').forEach((b,j)=>b.classList.toggle('on',j===i));
  const n=allQs(S).length;
  main.append(el('div','hero',`<div class="em">${S.icon}</div><div><h2>שלב ${i+1}: ${S.title}</h2><p>${S.sub}${n?` • ${n} שאלות לתרגול`:''}</p></div>`));
  S.blocks.forEach(b=>{
    if(b.k==='h')main.append(el('div','card '+b.cls,b.html));
    else if(b.k==='w'){const c=el('div','card');c.append(b.fn());main.append(c);}
    else if(b.k==='q')main.append(mkQ(b.q));
    else if(b.k==='b'){
      const g=el('div','bag');g.append(el('h3','','📝 '+b.title));
      const st=el('div','stem');const c=b.stem();st.append(c);g.append(st);
      b.qs.forEach(x=>g.append(mkQ(x.q)));main.append(g);
    }
  });
  const nav=el('div','navb');
  const prev=el('button','btn ghost','▶ השלב הקודם'),next=el('button','btn',i===STAGES.length-1?'חזרה להתחלה':'השלב הבא ◀');
  prev.disabled=i===0;prev.onclick=()=>go(i-1);next.onclick=()=>go(i===STAGES.length-1?0:i+1);
  nav.append(prev,next);main.append(nav);
  window.scrollTo({top:0});
  const act=document.querySelector('.step.on');if(act)act.scrollIntoView({inline:'center',block:'nearest'});
}
refreshBar();go(0);
</script>
